<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple gradient background matching the app header -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#purpleGradient)" stroke="#5a67d8" stroke-width="4"/>
  
  <!-- Briefcase icon -->
  <g transform="translate(256, 220)">
    <!-- Briefcase body -->
    <rect x="-60" y="-20" width="120" height="80" rx="8" fill="white" opacity="0.9"/>
    <!-- Briefcase handle -->
    <rect x="-20" y="-35" width="40" height="15" rx="7" fill="white" opacity="0.9"/>
    <!-- Briefcase lock -->
    <circle cx="0" cy="10" r="8" fill="#667eea"/>
    <!-- Briefcase corners -->
    <rect x="-65" y="-25" width="10" height="90" rx="5" fill="white" opacity="0.7"/>
    <rect x="55" y="-25" width="10" height="90" rx="5" fill="white" opacity="0.7"/>
  </g>
  
  <!-- JF Text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="120" font-weight="bold" 
        text-anchor="middle" fill="white" opacity="0.95">JF</text>
  
  <!-- Small highlight for professional look -->
  <circle cx="200" cy="180" r="40" fill="white" opacity="0.1"/>
</svg>